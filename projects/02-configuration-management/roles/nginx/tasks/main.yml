---
- name: Nginx | Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Nginx | Configure the reverse proxy
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/platform-lab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Nginx | Enable the site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/platform-lab.conf
    dest: /etc/nginx/sites-enabled/platform-lab.conf
    state: link
  notify: Reload nginx

- name: Nginx | Disable the packaged default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Nginx | Enable the service
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
