---
- name: Base | Install packages used by the host baseline
  ansible.builtin.package:
    name:
      - curl
      - ca-certificates
      - fail2ban
    state: present
    update_cache: true

- name: Base | Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: SSH | Ensure the operator ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.ssh"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  when: ssh_public_key is not search('REPLACE_WITH')

- name: SSH | Install the operator public key
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.ssh/authorized_keys"
    line: "{{ ssh_public_key }}"
    create: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: ssh_public_key is not search('REPLACE_WITH')
