apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/soufian-elouazzani/devops_projects.git
    targetRevision: master
    path: projects/05-kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-lab
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
