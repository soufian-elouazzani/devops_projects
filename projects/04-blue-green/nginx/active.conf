upstream platform_active {
    server app-blue:8080;
}

server {
    listen 80;

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://platform_active;
    }
}
