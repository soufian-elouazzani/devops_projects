name: platform-bluegreen

services:
  app-blue:
    build:
      context: ../../app
    image: platform-lab:blue
    environment:
      DEPLOY_COLOR: blue
      APP_VERSION: ${BLUE_VERSION:-1.0.0}
      PORT: "8080"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  app-green:
    build:
      context: ../../app
    image: platform-lab:green
    environment:
      DEPLOY_COLOR: green
      APP_VERSION: ${GREEN_VERSION:-1.0.0}
      PORT: "8080"
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/active.conf:/etc/nginx/conf.d/active.conf:ro
    ports:
      - "8080:80"
    depends_on:
      app-blue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
