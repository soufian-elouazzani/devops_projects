apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-app
  namespace: platform-lab
spec:
  podSelector:
    matchLabels:
      app: platform-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
