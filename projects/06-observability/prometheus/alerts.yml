groups:
  - name: platform-app
    rules:
      - alert: AppTargetDown
        expr: up{job="platform-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: platform-app is not being scraped
          description: Prometheus has been unable to scrape the application for 30 seconds.

      - alert: AppRequestRateHigh
        expr: sum(rate(app_requests_total[1m])) > 50
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: request rate is above the lab threshold
          description: The combined request rate has stayed above 50 requests per second for 1 minute.
